<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="billrBg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Subtle Drop Shadow for the Invoice Card -->
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#billrBg)" />

  <!-- Clean Minimalist Invoice Card with Folded Corner -->
  <g filter="url(#cardShadow)">
    <!-- Base Document -->
    <path
      d="M144 88C130.745 88 120 98.7452 120 112V400C120 413.255 130.745 424 144 424H368C381.255 424 392 413.255 392 400V168L312 88H144Z"
      fill="#FFFFFF"
    />

    <!-- Folded Top-Right Document Corner -->
    <path
      d="M312 88V152C312 160.837 319.163 168 328 168H392L312 88Z"
      fill="#DBEAFE"
    />
  </g>

  <!-- Indian Rupee (₹) Symbol - Precision Geometric Billing Identity -->
  <g stroke="#1D4ED8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Rupee Bar -->
    <path d="M178 184H298" stroke-width="24" />

    <!-- Second Rupee Bar -->
    <path d="M178 226H280" stroke-width="24" />

    <!-- Rupee Loop & Stem -->
    <path
      d="M214 184V264C214 264 282 264 282 222C282 184 214 184 214 184Z"
      stroke-width="24"
    />

    <!-- Rupee Diagonal Kick Leg -->
    <path d="M224 264L294 340" stroke-width="26" />
  </g>

  <!-- Invoice Ledger Line Items -->
  <g stroke-linecap="round">
    <!-- Left Item Ledger Indicator -->
    <line x1="178" y1="378" x2="238" y2="378" stroke="#94A3B8" stroke-width="16" />
    <!-- Right Amount Highlight Indicator -->
    <line x1="262" y1="378" x2="334" y2="378" stroke="#3B82F6" stroke-width="16" />
  </g>
</svg>
